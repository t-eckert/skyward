# Keep the DVB-T television driver away from the dongle.
#
# Raspberry Pi OS ships dvb_usb_rtl28xxu and loads it automatically, because as
# far as the kernel is concerned this *is* a television tuner. It claims the
# device at boot, before anything else can, and every attempt to open it then
# fails with "usb_claim_interface error -6" — which reads like a permissions
# problem and is not one.
#
#   sudo cp deploy/blacklist-rtl.conf /etc/modprobe.d/
#   sudo modprobe -r dvb_usb_rtl28xxu    # or just reboot
#
# Blacklisting the top module is not enough on its own: something else can pull
# it in as a dependency, so the modules it sits on are listed too.
blacklist dvb_usb_rtl28xxu
blacklist rtl2832
blacklist rtl2830
blacklist dvb_usb_v2
blacklist r820t
