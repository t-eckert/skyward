[package]
name = "adsb-dsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Signal processing: IQ samples in, validated Mode S frames out."

# This is the crate you will spend your learning time in. It depends only on
# adsb-core so that a `cargo test -p adsb-dsp` cycle stays under a second.
[dependencies]
adsb-core.workspace = true
thiserror.workspace = true

# Examples only. adsb-source does not depend on this crate, so there is no
# cycle -- and keeping it out of [dependencies] means the DSP crate stays
# testable with no I/O at all.
[dev-dependencies]
adsb-source.workspace = true
