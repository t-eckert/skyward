# Golden fixture — the primary optimization target for the scoreboard.
#
# Captured from the top-floor office on the open side of the house, antenna on
# a tripod in free air roughly 40 cm back from the window. NOT suction-cupped
# to the glass: doing that costs 24x (see `notes` below).

schema = 1
name = "golden"

[file]
path = "golden.cu8"
sha256 = "d55bba6512e1415a413851bdce1a396d9ecf03ea81f391be406c094c488d14f3"
bytes = 864_000_000
format = "cu8"              # interleaved unsigned 8-bit I,Q -- rtl_sdr native

[capture]
started_utc = "2026-08-07T02:55:09Z"
ended_utc   = "2026-08-07T02:58:11Z"
duration_s  = 180
center_freq_hz = 1_090_000_000
sample_rate_hz = 2_400_000  # requested; the RTL derives this from a 28.8 MHz
                            # fractional divider and 2.4 MS/s is exact (28.8/12)
gain_db = 49.6              # tuner max for this R820T
gain_mode = "manual"
agc = "unknown"             # rtl_sdr does not disable the RTL2832 digital AGC;
                            # see learning stage 0
bias_tee = false
tool = "rtl_sdr (homebrew, built from source)"

[hardware]
sdr = "RTL-SDR Blog V3"
tuner = "Rafael Micro R820T"
antenna = "RTL-SDR Blog dipole kit, both whips fully collapsed"
antenna_length_cm = 15.0    # tip to tip; ideal half-wave at 1090 MHz is 13.8
antenna_orientation = "vertical"
mount = "flexible tripod, free air, ~40 cm from window glass"

[receiver]
# TODO: fill in before enabling local CPR or the range plausibility gate.
# Deliberately left unset -- see the note in docs about refusing to start
# rather than defaulting to 0,0 (which is in the Gulf of Guinea and would make
# the range gate reject every aircraft).
lat = 0.0
lon = 0.0
altitude_m = 0.0
unset = true

# The scoreboard baseline: what the `baseline` impl set actually produces.
# Regenerate with:
#   cargo run --release --example score -- fixtures/raw/golden.cu8 2400000
[expected]
baseline_candidates = 879
baseline_crc_ok = 517
baseline_aircraft = 7
baseline_msg_per_min = 172.3
baseline_yield = 0.588

# Two independently measured improvements, both available before writing any
# new code. Useful as targets: if a change does not move the number toward
# these, it is not doing what you think.
[headroom]
# A mean-integrating detector (a crude stand-in for real correlation) finds
# 2403 CRC-valid messages and 9 aircraft in this same file. The baseline
# detector is therefore surfacing roughly a fifth of what is present, and
# stage 2 is where the ceiling is set.
better_detector_crc_ok = 2403
better_detector_aircraft = 9

# The exploratory lab tool got 607 messages from the same 879 candidates,
# because its bit slicer averaged over each half-bit slot where the baseline
# slicer takes a single sample per half. Identical detection, ~17% more
# messages -- that is stage 3's first improvement, already priced.
integrating_slicer_crc_ok = 607

[notes]
text = """
Reception is dominated by antenna placement, not by anything in software.
Measured on this hardware, same evening, same 2.4 MS/s and 49.6 dB gain:

  desk, tripod in open room          95 msg/min    3 aircraft
  window facing condo towers        0.5 msg/min    -
  this window, stuck to the glass    11 msg/min    3 aircraft
  this window, tripod in free air   261 msg/min    7 aircraft

Two lessons worth keeping. First, a dipole suction-cupped to a coated pane is
detuned and resistively loaded by the coating in its own near field: at 1090 MHz
the antenna is resonant and its near field is only ~4.4 cm deep. The noise floor
did not change (1.6 either way) while peak burst magnitude went 16.5 -> 113,
so the antenna was coupling less signal, not hearing less noise.

Second, FM at 98.5 MHz is a useful control. It went UP at every position where
1090 went down, because at 3 m wavelength the same 15 cm dipole is electrically
tiny and barely notices the coating. If both bands drop together, suspect the
cable or connector; if FM rises while 1090 falls, suspect geometry.
"""
